- id: sun
  scheme: light
  label: Sun (black / washed-yellow)
  classes:
    - black
    - bg-washed-yellow
  midtoneClass: gold
  accent: '#E7040F'
  project:
    tagActiveColor: '#ECE9E9'
  tokens:
    light:
      bg: '#fffceb'
      ink: '#000'
      muted: '#756000'
      accent: '#E7040F'
      rule: '#d9d4b0'
      surface: '#fffef5'
    font:
      body: Arial, 'Noto Sans SC', 'PingFang SC', sans-serif
      display: Arial, 'Noto Sans SC', 'PingFang SC', sans-serif
      mono: ui-monospace, monospace, 'Noto Sans SC', 'PingFang SC', sans-serif
    radius: 4px
  replaces: []
